name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # Contenido publicado desde Códice Admin. Solo si las variables del repo están definidas;
      # si no, el sitio se construye con los docs del repositorio (como antes).
      # La clave anónima es pública por diseño: RLS solo deja leer lo publicado.
      - name: Sincronizar contenido desde Códice Admin
        if: ${{ vars.SUPABASE_URL != '' }}
        run: npm run sync
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - run: npm run build
        env:
          CHAT_API_URL: ${{ vars.CHAT_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
